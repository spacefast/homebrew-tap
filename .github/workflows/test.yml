name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # Blacksmith for everything it offers; it has no Intel macOS runners, so
        # darwin-x64 stays on GitHub-hosted.
        runner:
          - blacksmith-6vcpu-macos-latest
          - macos-15-intel
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-2vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            sudo chown -R "$(id -un)" /home/linuxbrew/.linuxbrew
          else
            NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      # Runner images can carry an old Homebrew (one misread the version from the
      # URL); test with the current release, as users get by default.
      - run: brew update
      # Tap this checkout by path so pull requests test their own formula changes.
      - run: brew tap spacefast/tap "$GITHUB_WORKSPACE"
      - run: brew install spacefast/tap/spacefast
      - run: brew test spacefast/tap/spacefast
      - run: spacefast --version && sf --version
      - run: brew style spacefast/tap/spacefast
      - run: brew audit --strict spacefast/tap/spacefast
        # The CLI release archives carry the build host's linux-x64
        # node_modules/esbuild/bin/esbuild, which audit flags on linux-arm64.
        # Remove once the CLI binary build stops copying it.
        continue-on-error: ${{ matrix.runner == 'blacksmith-2vcpu-ubuntu-2404-arm' }}
